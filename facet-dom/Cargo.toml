[package]
name = "teamy-facet-dom"
version = "0.50.0-rc.7"

edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TeamDman-maintained fork of facet-dom: tree-based serialization and deserialization for HTML and XML"
keywords = ["dom", "html", "xml", "facet", "deserialization"]
categories = ["encoding", "parsing", "web-programming"]
homepage = "https://github.com/TeamDman/facet-format"
documentation = "https://docs.rs/teamy-facet-dom"
readme = "README.md"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[lib]
name = "facet_dom"

[dependencies]
facet-core.workspace = true
facet-dessert = { workspace = true }
facet-reflect.workspace = true
facet-singularize = { workspace = true }
heck = "0.5.0"
owo-colors = { workspace = true }
tracing = { workspace = true, optional = true }

[dev-dependencies]
tracing = { workspace = true }

[features]
default = []
net = ["facet-core/net"]
tracing = ["dep:tracing"]

[lints]
workspace = true
