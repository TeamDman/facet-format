[package]
name = "teamy-facet-csv"
version = "0.50.0-rc.9"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TeamDman-maintained fork of facet-csv: CSV serialization for facet using the new format architecture"
keywords = ["csv", "serialization", "facet", "parsing", "tabular"]
categories = ["encoding", "parsing"]
homepage = "https://github.com/TeamDman/facet-format"
documentation = "https://docs.rs/teamy-facet-csv"
readme = "README.md"

[lib]
name = "facet_csv"
path = "src/lib.rs"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
facet.workspace = true
facet-core.workspace = true
facet-format = { package = "teamy-facet-format", version = "=0.50.0-rc.9", path = "../facet-format", }
facet-reflect.workspace = true
zmij = { version = "1", optional = true }
itoa = { version = "1", optional = true }

[dev-dependencies]
facet = { workspace = true, features = ["std", "doc", "net"] }
# facet-format-suite = { path = "../facet-format-suite", version = "0.35.0", features = ["third-party"] }
# indoc = { workspace = true }
# libtest-mimic = "0.8.1"

# TODO: Add tests once implementation is validated
# [[test]]
# name = "format_suite"
# harness = false

[features]
default = []
fast = ["dep:zmij", "dep:itoa"]
net = ["facet-format/net", "facet-core/net"]

[lints]
workspace = true
