name: Release-plz

on:
  workflow_dispatch:
    inputs:
      command:
        description: 'Choose release preparation or publication'
        required: true
        type: choice
        default: release-pr
        options:
          - release-pr
          - release

jobs:
  release-plz-release:
    if: github.repository == 'TeamDman/facet-format' && github.ref == 'refs/heads/teamy-main' && inputs.command == 'release'
    name: Release-plz release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: teamy-main
          path: facet-format
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout matching Teamy core family
        uses: actions/checkout@v7
        with:
          repository: TeamDman/facet
          ref: teamy-main
          path: facet
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Get crates.io token via OIDC
        uses: rust-lang/crates-io-auth-action@v1.0.5
        id: crates-io-auth
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          manifest_path: facet-format/Cargo.toml
          config: facet-format/release-plz.toml
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}

  release-plz-pr:
    if: github.repository == 'TeamDman/facet-format' && github.ref == 'refs/heads/teamy-main' && inputs.command == 'release-pr'
    name: Release-plz PR
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: teamy-main
          path: facet-format
          fetch-depth: 0
          persist-credentials: false
      - name: Checkout matching Teamy core family
        uses: actions/checkout@v7
        with:
          repository: TeamDman/facet
          ref: teamy-main
          path: facet
          persist-credentials: false
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Run release-plz
        uses: release-plz/action@v0.5
        with:
          manifest_path: facet-format/Cargo.toml
          config: facet-format/release-plz.toml
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
