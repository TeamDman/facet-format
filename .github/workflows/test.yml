name: Tests

on:
  push:
    branches: [teamy-main]
  pull_request:
    branches: [teamy-main]
  merge_group:

defaults:
  run:
    working-directory: facet-format

jobs:
  test-linux:
    runs-on: ubuntu-latest
    env:
      PROPTEST_CASES: 0
    steps:
      - uses: actions/checkout@v6
        with:
          path: facet-format
      - name: Checkout matching Teamy core family
        uses: actions/checkout@v7
        with:
          repository: TeamDman/facet
          ref: teamy-main
          path: facet
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      - name: Run tests with coverage
        run: |
          rustup toolchain install nightly
          cargo +nightly llvm-cov --no-report nextest --workspace --features teamy-facet-json/ci
          cargo +nightly llvm-cov --no-report --doc --workspace
          mkdir -p coverage
          cargo +nightly llvm-cov report --doctests --lcov --output-path coverage/lcov.info

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: facet-format/coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: facet-format
      - name: Checkout matching Teamy core family
        uses: actions/checkout@v7
        with:
          repository: TeamDman/facet
          ref: teamy-main
          path: facet
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri,rust-src,llvm-tools-preview

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Run Miri
        run: just miri-json

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: facet-format
      - name: Checkout matching Teamy core family
        uses: actions/checkout@v7
        with:
          repository: TeamDman/facet
          ref: teamy-main
          path: facet
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-hack

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check MSRV
        run: just msrv

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: facet-format
      - name: Checkout matching Teamy core family
        uses: actions/checkout@v7
        with:
          repository: TeamDman/facet
          ref: teamy-main
          path: facet
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: just docs


  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: facet-format
      - name: Checkout matching Teamy core family
        uses: actions/checkout@v7
        with:
          repository: TeamDman/facet
          ref: teamy-main
          path: facet
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Check lockfile
        run: just lockfile


  test-macos:
    runs-on: macos-26
    env:
      PROPTEST_CASES: 0
    steps:
      - uses: actions/checkout@v6
        with:
          path: facet-format
      - name: Checkout matching Teamy core family
        uses: actions/checkout@v7
        with:
          repository: TeamDman/facet
          ref: teamy-main
          path: facet
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          cache-bin: "false"

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run nextest tests
        run: cargo nextest run --workspace

  test-windows:
    runs-on: windows-2025
    env:
      PROPTEST_CASES: 0
    steps:
      - uses: actions/checkout@v6
        with:
          path: facet-format
      - name: Checkout matching Teamy core family
        uses: actions/checkout@v7
        with:
          repository: TeamDman/facet
          ref: teamy-main
          path: facet
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run nextest tests
        run: cargo nextest run --workspace
