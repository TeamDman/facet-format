[package]
name = "teamy-facet-format"
version = "0.50.0-rc.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TeamDman-maintained fork of facet-format: Core Serializer/Deserializer traits for facet"
keywords = ["serialization", "deserialization", "facet", "reflection"]
categories = ["encoding", "parsing"]
homepage = "https://github.com/TeamDman/facet-format"
documentation = "https://docs.rs/teamy-facet-format"
readme = "README.md"

[lib]
name = "facet_format"
path = "src/lib.rs"

[package.metadata.docs.rs]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
tracing = { version = "0.1", default-features = false, optional = true }
facet-core.workspace = true
facet-dessert = { package = "teamy-facet-dessert", version = "=0.50.0-rc.7", path = "../facet-dessert", }
facet-path.workspace = true
facet-reflect.workspace = true
facet-solver.workspace = true
# Pretty error rendering (optional)
ariadne = { version = "0.6", optional = true }

[dev-dependencies]
facet = { package = "teamy-facet", path = "../../facet/facet" }

[features]
default = []
alloc = []
# Enable logging via tracing
tracing = ["dep:tracing"]
# Network types (IpAddr, SocketAddr, etc.)
net = ["facet-core/net"]
# compact_str support
compact_str = ["facet-core/compact_str"]
# Pretty error rendering with ariadne
ariadne = ["dep:ariadne"]

[package.metadata.cargo-shear]
ignored = ["tracing"]

[lints]
workspace = true
