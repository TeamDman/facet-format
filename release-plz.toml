[workspace]
changelog_update = true
semver_check = true
dependencies_update = false
git_release_enable = true
release = false
publish = false
repo_url = "https://github.com/TeamDman/facet-format"

# Only the independently named Teamy packages participate in fork releases.
# The compatible Teamy core family must be published before these packages.
[[package]]
name = "teamy-facet-format"
release = true
publish = true
version_group = "teamy-facet-format"
changelog_path = "CHANGELOG.md"

[[package]]
name = "teamy-facet-dessert"
release = true
publish = true
version_group = "teamy-facet-format"
changelog_path = "CHANGELOG.md"

[[package]]
name = "teamy-facet-json"
release = true
publish = true
version_group = "teamy-facet-format"
changelog_path = "CHANGELOG.md"

[[package]]
name = "teamy-facet-value"
release = true
publish = true
version_group = "teamy-facet-format"
changelog_path = "CHANGELOG.md"
