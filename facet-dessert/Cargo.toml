[package]
name = "teamy-facet-dessert"
version = "0.50.0-rc.7"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "TeamDman-maintained fork of facet-dessert: Sweet helpers for facet deserialization - shared between facet-format and facet-dom"
keywords = ["serialization", "deserialization", "facet", "reflection"]
categories = ["encoding", "parsing"]
homepage = "https://github.com/TeamDman/facet-format"
documentation = "https://docs.rs/teamy-facet-dessert"
readme = "README.md"

[lib]
name = "facet_dessert"
path = "src/lib.rs"

[package.metadata]

[package.metadata."docs.rs"]
rustdoc-args = ["--html-in-header", "arborium-header.html"]

[dependencies]
facet-core.workspace = true
facet-reflect.workspace = true
[features]
default = []

[lints]
workspace = true
